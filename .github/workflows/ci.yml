# Logistics Flow Studio - CI
# Verification, not decoration: every step below runs a real check that
# already exists in the repo (see test/run-all.mjs and docs/MEASUREMENTS.md).
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC: every check re-run on the default branch, weekly

jobs:
  verify-js:
    name: JS syntax + verification harnesses + offline guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Syntax-check every JavaScript file (node --check)
        run: |
          set -e
          count=0
          while IFS= read -r f; do
            node --check "$f"
            count=$((count + 1))
          done < <(git ls-files '*.js' '*.mjs')
          echo "node --check passed on $count files"

      - name: Run all verification harnesses (test/run-all.mjs)
        # Executes measure_optimizer.js, verify_heatmap.js, lsp/verify.js
        # and tools/offline-guard.mjs as child processes; any nonzero
        # exit fails this step.
        run: node test/run-all.mjs

      - name: Offline guard (standalone)
        # Also run the guard directly so a violation is its own red step:
        # no external src=/href=, no CSS @import, no url(http...), no
        # fetch/WebSocket to external hosts in any app file. Markdown is
        # not scanned (github.com anchors in README are fine).
        run: node tools/offline-guard.mjs

  verify-python:
    name: Python invariants + Ruff + deliverables one-pager
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install tooling (ruff, matplotlib)
        run: python -m pip install --quiet ruff matplotlib

      - name: Ruff lint
        run: python -m ruff check .

      - name: Run SQL, routing and resource-planning tests
        run: python -m unittest discover -s test -p 'test_*.py' -v

      - name: Import the recorded fixtures, write a Markdown report, reconcile SQLite against the JavaScript rows (tools/run_ledger.py)
        run: |
          set -e
          db="$RUNNER_TEMP/run.sqlite"
          python tools/run_ledger.py import test/fixtures/run-ledger.json --database "$db"
          python tools/run_ledger.py import test/fixtures/run-ledger-b.json --database "$db"
          python tools/run_ledger.py import test/fixtures/run-ledger-c.json --database "$db"
          python tools/run_ledger.py report --database "$db" --runs RUN-hand-built-s31-hc28a7688 RUN-hand-built-s31-hd35e45d4 --out "$RUNNER_TEMP/report.md"
          grep -q '^Invariant violations: 0' "$RUNNER_TEMP/report.md"
          grep -q '^### v_compare_cost' "$RUNNER_TEMP/report.md"
          python tools/export_viewer_sql.py --check
          # v3.43: the JavaScript rows of 13 views (node) against SQLite's, column by column;
          # both sides sum compensated, so the rounded aggregates may differ by one step at most
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"
          node tools/make_run_ledger_fixture.mjs reconcile "$RUNNER_TEMP/rec"
          for f in run-ledger run-ledger-b run-ledger-c; do
            python tools/run_ledger.py reconcile "test/fixtures/$f.json" --js "$RUNNER_TEMP/rec/$f.reconcile.json"
          done

      - name: Build the one-pager PDF and check its size
        run: |
          set -e
          python tools/make_onepager.py
          size=$(stat -c%s deliverables/warehousetwin_onepager.pdf)
          echo "PDF size: $size bytes"
          if [ "$size" -le 10240 ]; then
            echo "PDF is suspiciously small (<= 10 KB) - failing"
            exit 1
          fi

  verify-browser:
    name: In-browser self-tests (headless Chrome through tools/gate.py)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locate the browser the runner image ships
        run: which google-chrome || which chromium-browser || which chromium

      - name: Both self-tests (index.html?selftest=1, run-ledger.html?selftest=1) and README line 9
        # tools/gate.py serves the repo over http on a free port, opens each page
        # headlessly with a virtual-time budget, scrapes the WT-SELFTEST line
        # (a missing line is a failure) and fails when README line 9's counts
        # drift from what was measured.
        run: python tools/gate.py --skip-node --skip-python --check-readme
